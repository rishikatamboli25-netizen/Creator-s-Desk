name: Render CronJob

on:
  schedule:
    - cron: "*/2 * * * *"

  workflow_dispatch:

jobs:
  run-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run cron job
        run: |
          echo "Cron job is running"
          node scripts/cron.js